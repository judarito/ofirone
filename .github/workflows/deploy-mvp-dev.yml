name: Deploy MVP (dev)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'backend-go/**'
      - 'web/**'
      - 'shared/**'
      - 'render.yaml'
      - '.github/workflows/deploy-mvp-dev.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Test backend Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/api

  frontend:
    name: Test and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL || secrets.VITE_BACKEND_API_URL }}
          # MVP: todas las operaciones soportadas deben usar el backend Go.
          # Son flags públicos del bundle, no secretos.
          VITE_USE_BACKEND_AUTH: 'true'
          VITE_USE_BACKEND_CUSTOMERS: 'true'
          VITE_USE_BACKEND_TENANT_CONFIG: 'true'
          VITE_USE_BACKEND_LOOKUPS: 'true'
          VITE_USE_BACKEND_MASTERS: 'true'
          VITE_USE_BACKEND_CATALOG: 'true'
          VITE_USE_BACKEND_INVENTORY: 'true'
          VITE_USE_BACKEND_POS_CONTEXT: 'true'
          VITE_USE_BACKEND_PURCHASES: 'true'
          VITE_USE_BACKEND_SALES: 'true'
          VITE_USE_BACKEND_CXC: 'true'
          VITE_USE_BACKEND_REPORTS: 'true'
          VITE_USE_BACKEND_ALERTS: 'true'
          VITE_USE_BACKEND_PRICING: 'true'
          # Estos dos flujos aún no forman parte del MVP Go.
          VITE_USE_BACKEND_IMPORT_JOBS: 'false'
          VITE_USE_BACKEND_MEDIA_JOBS: 'false'
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  deploy-backend:
    name: Trigger Render deploy
    needs: backend
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK no configurado; se omite el despliegue."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  deploy-frontend:
    name: Deploy Cloudflare Pages
    needs: frontend
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Deploy Pages preview for dev
        working-directory: web
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "Credenciales de Cloudflare Pages incompletas; se omite el despliegue."
            exit 0
          fi
          npx --yes wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
